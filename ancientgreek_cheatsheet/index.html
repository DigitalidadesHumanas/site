<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Frequency Counter</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent-bg: #f1f5f9;
      --bar-fill: #bfdbfe;
      --radius: 8px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    header h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--text-main);
    }

    header p {
      color: var(--text-muted);
      margin-top: 0.25rem;
      font-size: 0.95rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }

    .textarea-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 0.75rem;
      font-family: inherit;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      resize: vertical;
      outline: none;
      transition: border-color 0.2s ease;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
    }

    .checkbox-group input {
      cursor: pointer;
      width: 16px;
      height: 16px;
    }

    .btn {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius);
      padding: 0.6rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .stats-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-box {
      background-color: var(--accent-bg);
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      text-align: center;
    }

    .stat-box .value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-box .label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 0.25rem;
    }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .results-table th,
    .results-table td {
      padding: 0.6rem 0.75rem;
      text-align: left;
    }

    .results-table th {
      background-color: var(--accent-bg);
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }

    .results-table tr:not(:last-child) td {
      border-bottom: 1px solid var(--border-color);
    }

    .bar-cell {
      width: 40%;
    }

    .bar-container {
      width: 100%;
      background-color: var(--accent-bg);
      border-radius: 4px;
      height: 12px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background-color: var(--primary);
      border-radius: 4px;
      width: 0%;
      transition: width 0.3s ease;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 2rem 0;
      font-size: 0.9rem;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      margin-top: 0.5rem;
      border-top: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .links-group {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .action-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .action-link:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Word Frequency Counter</h1>
      <p>Analyze text and find the most common words in real-time</p>
    </header>

    <div class="card">
      <div class="textarea-group">
        <label for="textInput">Enter or Paste Your Text</label>
        <textarea id="textInput" placeholder="Type or paste text here..."></textarea>
      </div>

      <div class="controls">
        <div style="display: flex; gap: 1.25rem; flex-wrap: wrap;">
          <label class="checkbox-group">
            <input type="checkbox" id="ignoreCase" checked>
            Ignore Case
          </label>
          <label class="checkbox-group">
            <input type="checkbox" id="ignoreStopwords">
            Exclude Common Words (the, is, and...)
          </label>
        </div>
        <button class="btn" id="clearBtn">Clear Text</button>
      </div>
    </div>

    <div class="card">
      <div class="stats-summary">
        <div class="stat-box">
          <div class="value" id="totalWords">0</div>
          <div class="label">Total Words</div>
        </div>
        <div class="stat-box">
          <div class="value" id="uniqueWords">0</div>
          <div class="label">Unique Words</div>
        </div>
        <div class="stat-box">
          <div class="value" id="totalChars">0</div>
          <div class="label">Characters</div>
        </div>
      </div>

      <div id="resultsContainer">
        <table class="results-table" id="resultsTable">
          <thead>
            <tr>
              <th style="width: 10%;">Rank</th>
              <th style="width: 35%;">Word</th>
              <th style="width: 15%;">Count</th>
              <th class="bar-cell">Frequency</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Results populated via JS -->
          </tbody>
        </table>
        <div id="emptyState" class="empty-state">
          Enter text above to display word frequency analysis.
        </div>
      </div>

      <footer>
        <div class="links-group">
          <a href="#" id="importLink" class="action-link">[I] Importar</a>
          <a href="#" id="dictLink" class="action-link">[D] Add Dictionary</a>
        </div>
        <input type="file" id="fileInput" accept=".txt" class="hidden">
        <input type="file" id="dictInput" accept=".json" class="hidden">
        <button class="btn" id="exportBtn">Exportar</button>
      </footer>
    </div>
  </div>

  <script>
    const stopWords = new Set([
      "a", "about", "above", "after", "again", "against", "all", "am", "an", "and", "any", "are", "aren't", 
      "as", "at", "be", "because", "been", "before", "being", "below", "between", "both", "but", "by", 
      "can't", "cannot", "could", "couldn't", "did", "didn't", "do", "does", "doesn't", "doing", "don't", 
      "down", "during", "each", "few", "for", "from", "further", "had", "hadn't", "has", "hasn't", "have", 
      "haven't", "having", "he", "he'd", "he'll", "he's", "her", "here", "here's", "hers", "herself", 
      "him", "himself", "his", "how", "how's", "i", "i'd", "i'll", "i'm", "i've", "if", "in", "into", "is", 
      "isn't", "it", "it's", "its", "itself", "let's", "me", "more", "most", "mustn't", "my", "myself", 
      "no", "nor", "not", "of", "off", "on", "once", "only", "or", "other", "ought", "our", "ours", 
      "ourselves", "out", "over", "own", "same", "shan't", "she", "she'd", "she'll", "she's", "should", 
      "shouldn't", "so", "some", "such", "than", "that", "that's", "the", "their", "theirs", "them", 
      "themselves", "then", "there", "there's", "these", "they", "they'd", "they'll", "they're", "they've", 
      "this", "those", "through", "to", "too", "under", "until", "up", "very", "was", "wasn't", "we", 
      "we'd", "we'll", "we're", "we've", "were", "weren't", "what", "what's", "when", "when's", "where", 
      "where's", "which", "while", "who", "who's", "whom", "why", "why's", "with", "won't", "would", 
      "wouldn't", "you", "you'd", "you'll", "you're", "you've", "your", "yours", "yourself", "yourselves"
    ]);

    const textInput = document.getElementById('textInput');
    const ignoreCaseToggle = document.getElementById('ignoreCase');
    const ignoreStopwordsToggle = document.getElementById('ignoreStopwords');
    const clearBtn = document.getElementById('clearBtn');

    const totalWordsEl = document.getElementById('totalWords');
    const uniqueWordsEl = document.getElementById('uniqueWords');
    const totalCharsEl = document.getElementById('totalChars');
    const tableBody = document.getElementById('tableBody');
    const emptyState = document.getElementById('emptyState');
    const resultsTable = document.getElementById('resultsTable');

    const importLink = document.getElementById('importLink');
    const fileInput = document.getElementById('fileInput');
    const dictLink = document.getElementById('dictLink');
    const dictInput = document.getElementById('dictInput');
    const exportBtn = document.getElementById('exportBtn');

    let currentSortedWords = [];
    let dictionaryData = null;

    function parseWordPattern(word) {
      const match = word.match(/^(?:@@(.*?)@@)?(?:\s*==\s*(.*?)\s*==)?(?:\s*\+\+\s*(.*?)\s*\+\+)?(?:\s*##\s*(\d+)\s*##)?$/);
      if (match) {
        return {
          atSection: match[1] || '',
          eqSection: match[2] || '',
          defSection: match[3] || '',
          numSection: match[4] || ''
        };
      }
      return { atSection: '', eqSection: '', defSection: word, numSection: '' };
    }

    function formatWordPattern(at, eq, def, num) {
      let result = '';
      if (at) result += `@@ ${at} @@ `;
      if (eq) result += `== ${eq} == `;
      result += `++ ${def} ++`;
      if (num) result += ` ## ${num} ##`;
      return result;
    }

    function analyzeText() {
      const rawText = textInput.value;
      const ignoreCase = ignoreCaseToggle.checked;
      const ignoreStopwords = ignoreStopwordsToggle.checked;

      totalCharsEl.textContent = rawText.length.toLocaleString();

      if (!rawText.trim()) {
        totalWordsEl.textContent = '0';
        uniqueWordsEl.textContent = '0';
        tableBody.innerHTML = '';
        resultsTable.classList.add('hidden');
        emptyState.classList.remove('hidden');
        currentSortedWords = [];
        return;
      }

      // Extract words handling unicode letters, apostrophes, pattern markers, and trailing integer
      const words = rawText.match(/(?:@@.*?@@\s*)?(?:==.*?==\s*)?(?:\+\+.*?\+\+\s*)?[\p{L}\p{N}']+(?:\s*#\s*\d+)?(?:\s*##\s*\d+\s*##)?/gu) || [];

      totalWordsEl.textContent = words.length.toLocaleString();

      const frequencyMap = new Map();

      words.forEach(rawWord => {
        let word = ignoreCase ? rawWord.toLowerCase() : rawWord;
        
        // Strip leading/trailing single quotes from punctuation matching
        word = word.replace(/^'+|'+$/g, '');
        if (!word) return;

        const checkWord = word.toLowerCase();
        if (ignoreStopwords && stopWords.has(checkWord)) {
          return;
        }

        frequencyMap.set(word, (frequencyMap.get(word) || 0) + 1);
      });

      uniqueWordsEl.textContent = frequencyMap.size.toLocaleString();

      currentSortedWords = Array.from(frequencyMap.entries()).sort((a, b) => b[1] - a[1]);

      if (dictionaryData) {
        applyDictionary();
      } else {
        renderTable(currentSortedWords);
      }
    }

    function applyDictionary() {
      if (!dictionaryData || currentSortedWords.length === 0) return;

      currentSortedWords = currentSortedWords.map(([wordKey, count]) => {
        const parts = parseWordPattern(wordKey);
        
        // Find matching lemma key in dictionary
        let matchedDictEntry = null;
        for (const dictKey in dictionaryData) {
          const entry = dictionaryData[dictKey];
          if (entry && (entry.lemma === wordKey || entry.lemma_normalized === wordKey || dictKey === wordKey)) {
            matchedDictEntry = entry;
            break;
          }
        }

        if (matchedDictEntry && matchedDictEntry.definitions) {
          const defsJoined = matchedDictEntry.definitions.join(' | ');
          const updatedDef = parts.defSection ? `${parts.defSection} ${defsJoined}` : defsJoined;
          const formattedWord = formatWordPattern(parts.atSection, parts.eqSection, updatedDef, parts.numSection);
          return [formattedWord, count];
        }

        return [wordKey, count];
      });

      renderTable(currentSortedWords);
    }

    function renderTable(sortedWords) {
      tableBody.innerHTML = '';

      if (sortedWords.length === 0) {
        resultsTable.classList.add('hidden');
        emptyState.classList.remove('hidden');
        emptyState.textContent = 'No matching words found with current filter settings.';
        return;
      }

      emptyState.classList.add('hidden');
      resultsTable.classList.remove('hidden');

      const maxCount = sortedWords[0][1];
      const topWords = sortedWords.slice(0, 50); // Display top 50

      topWords.forEach(([word, count], index) => {
        const percentage = Math.round((count / maxCount) * 100);
        const tr = document.createElement('tr');

        tr.innerHTML = `
          <td>${index + 1}</td>
          <td><strong>${escapeHtml(word)}</strong></td>
          <td>${count.toLocaleString()}</td>
          <td class="bar-cell">
            <div class="bar-container">
              <div class="bar-fill" style="width: ${percentage}%;"></div>
            </div>
          </td>
        `;

        tableBody.appendChild(tr);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Import TXT functionality
    importLink.addEventListener('click', (e) => {
      e.preventDefault();
      fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const lines = evt.target.result.split(/\r?\n/);
        const frequencyMap = new Map();
        let totalCount = 0;

        lines.forEach(line => {
          const trimmed = line.trim();
          if (!trimmed) return;

          const match = trimmed.match(/^(.+?)[\s:=]+(\d+)$/);
          if (match) {
            const word = match[1].trim();
            const count = parseInt(match[2], 10);
            if (word && !isNaN(count)) {
              frequencyMap.set(word, (frequencyMap.get(word) || 0) + count);
              totalCount += count;
            }
          }
        });

        currentSortedWords = Array.from(frequencyMap.entries()).sort((a, b) => b[1] - a[1]);

        totalWordsEl.textContent = totalCount.toLocaleString();
        uniqueWordsEl.textContent = frequencyMap.size.toLocaleString();
        totalCharsEl.textContent = evt.target.result.length.toLocaleString();

        if (dictionaryData) {
          applyDictionary();
        } else {
          renderTable(currentSortedWords);
        }
      };

      reader.readAsText(file);
      fileInput.value = '';
    });

    // Add Dictionary JSON functionality
    dictLink.addEventListener('click', (e) => {
      e.preventDefault();
      dictInput.click();
    });

    dictInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          let jsonText = evt.target.result.trim();
          // Fix malformed JSON if it starts with leading trailing brackets/commas
          if (jsonText.startsWith('],') || jsonText.startsWith(']')) {
            jsonText = '{' + jsonText.replace(/^[\s\],]+/, '');
          }
          if (!jsonText.endsWith('}')) {
            jsonText = jsonText + '}';
          }

          dictionaryData = JSON.parse(jsonText);
          alert('Dictionary successfully loaded!');
          applyDictionary();
        } catch (err) {
          alert('Error parsing JSON dictionary file: ' + err.message);
        }
      };

      reader.readAsText(file);
      dictInput.value = '';
    });

    // Export functionality
    exportBtn.addEventListener('click', () => {
      if (currentSortedWords.length === 0) {
        alert('No hay datos para exportar.');
        return;
      }

      const content = currentSortedWords.map(([word, count]) => `${word} ${count}`).join('\n');
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'frecuencia_palabras.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    textInput.addEventListener('input', analyzeText);
    ignoreCaseToggle.addEventListener('change', analyzeText);
    ignoreStopwordsToggle.addEventListener('change', analyzeText);

    clearBtn.addEventListener('click', () => {
      textInput.value = '';
      analyzeText();
      textInput.focus();
    });
  </script>
</body>
</html>
