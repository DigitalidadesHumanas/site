<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: monospace;
      margin: 0;
      padding: 0;
      background-color: #fff;
      color: #000;
      overflow: hidden;
    }

    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 10px 15px 5px 15px;
    }

    .top-bar {
      margin-bottom: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Contenedor principal con scroll vertical para las páginas */
    .pages-scroll-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      margin-bottom: 6px;
    }

    /* Cada página ocupa el alto/ancho disponible */
    .page-sheet {
      width: 100%;
      box-sizing: border-box;
      border-bottom: 2px dashed #999;
      padding-bottom: 10px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    .page-header {
      font-weight: bold;
      font-size: 0.9em;
      margin-bottom: 6px;
      color: #444;
      border-bottom: 1px solid #ddd;
      padding-bottom: 2px;
    }

    .dictionary-grid {
      flex: 1;
      display: grid;
      gap: 0 15px;
      overflow: hidden;
    }

    .column {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px dotted #ccc;
      padding-right: 10px;
    }

    .column:last-child {
      border-right: none;
      padding-right: 0;
    }

    .entry {
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
    }

    .seccion {
      margin-top: 2px;
      margin-bottom: 4px;
      padding-left: 10px;
    }

    .seccion p {
      margin: 0;
      padding: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-bar {
      height: 2.2em;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      flex-shrink: 0;
      border-top: 1px solid #eee;
      padding-top: 4px;
    }

    .error {
      color: red;
    }
  </style>
</head>
<body>

  <div id="app"></div>

  <script>
    const PLANTILLA_DEFAULT = "@@  @@ ==  == ++  ++ ##  ##";
    const RATIO_AUREO = 1.61803398875;

    function inicializarDatos() {
      if (localStorage.length === 0) {
        const keyEjemplo = "αρχαίος";
        const valEjemplo = "@@ αρχ>fuerza,energia, dominio, gobierno|αίος, αρχ<antiguo|αίος<< @@ == χώρα, ἄρχω == ++ πρὸ πολύς Χρόνος ++ ## 123 ##";
        localStorage.setItem(keyEjemplo, valEjemplo);
      }
    }

    function parsearValue(valStr) {
      let poetologico = "";
      let isophonos = "";
      let glosa = "";
      let num = "";

      const matchPoet = valStr.match(/@@(.*?)@@/);
      if (matchPoet) poetologico = matchPoet[1].trim();

      const matchIso = valStr.match(/==(.*?)==/);
      if (matchIso) isophonos = matchIso[1].trim();

      const matchGlosa = valStr.match(/\+\+(.*?)\+\+/);
      if (matchGlosa) glosa = matchGlosa[1].trim();

      const matchNum = valStr.match(/\#\#([0-9\s]*?)\#\#/);
      if (matchNum) num = matchNum[1].trim();

      return { poetologico, isophonos, glosa, num };
    }

    function generarSufijo(n) {
      let resultado = "";
      while (n >= 0) {
        resultado = String.fromCharCode((n % 26) + 65) + resultado;
        n = Math.floor(n / 26) - 1;
      }
      return "_" + resultado;
    }

    function obtenerClaveUnica(baseKey) {
      if (localStorage.getItem(baseKey) === null) {
        return baseKey;
      }
      let i = 0;
      while (true) {
        const sufijo = generarSufijo(i);
        const nuevaClave = baseKey + sufijo;
        if (localStorage.getItem(nuevaClave) === null) {
          return nuevaClave;
        }
        i++;
      }
    }

    let claveExpandida = null;
    let claveEditando = null;
    let esNuevaEntrada = false;
    let mensajeError = "";

    function reRender() {
      const scrollContainer = document.querySelector(".pages-scroll-container");
      const scrollTop = scrollContainer ? scrollContainer.scrollTop : 0;
      
      const appDiv = document.getElementById("app");
      appDiv.innerHTML = obtenerHTML();

      const newScrollContainer = document.querySelector(".pages-scroll-container");
      if (newScrollContainer) {
        newScrollContainer.scrollTop = scrollTop;
      }
    }

    function toggleExpandir(key) {
      if (claveExpandida === key) {
        claveExpandida = null;
      } else {
        claveExpandida = key;
      }
      reRender();
    }

    function iniciarEdicion(key) {
      claveEditando = key;
      esNuevaEntrada = false;
      mensajeError = "";
      reRender();
    }

    function iniciarNuevaEntrada() {
      claveEditando = "";
      esNuevaEntrada = true;
      mensajeError = "";
      reRender();
    }

    function cancelarEdicion() {
      claveEditando = null;
      esNuevaEntrada = false;
      mensajeError = "";
      reRender();
    }

    function guardarEntrada() {
      const keyInput = document.getElementById("input-key").value.trim();
      const valInput = document.getElementById("input-val").value.trim();

      if (!keyInput) {
        mensajeError = "La clave no puede estar vacía.";
        reRender();
        return;
      }

      const tienePoet = /@@.*?@@/.test(valInput);
      const tieneIso = /==.*?==/.test(valInput);
      const tieneGlosa = /\+\+.*?\+\+/.test(valInput);
      const tieneNum = /\#\#[0-9\s]*?\#\#/.test(valInput);

      if (!tienePoet || !tieneIso || !tieneGlosa || !tieneNum) {
        mensajeError = "El valor no cumple con el formato requerido: @@ ... @@ == ... == ++ ... ++ ## ... ##";
        reRender();
        return;
      }

      if (!esNuevaEntrada && claveEditando !== keyInput) {
        localStorage.removeItem(claveEditando);
      }

      localStorage.setItem(keyInput, valInput);
      claveEditando = null;
      claveExpandida = keyInput;
      esNuevaEntrada = false;
      mensajeError = "";
      reRender();
    }

    function eliminarEntrada(key) {
      if (confirm(`¿Eliminar la entrada "${key}"?`)) {
        localStorage.removeItem(key);
        if (claveExpandida === key) claveExpandida = null;
        if (claveEditando === key) claveEditando = null;
        reRender();
      }
    }

    function abrirSelectorArchivo() {
      document.getElementById("input-file-txt").click();
    }

    function importarDesdeArchivo(event) {
      const archivo = event.target.files[0];
      if (!archivo) return;

      const lector = new FileReader();
      lector.onload = function(e) {
        const contenido = e.target.result;
        const lineas = contenido.split("\n");

        lineas.forEach(linea => {
          const lineaLimpia = linea.trim();
          if (!lineaLimpia) return;

          const posSeparador = lineaLimpia.indexOf(":");
          if (posSeparador !== -1) {
            const keyBase = lineaLimpia.substring(0, posSeparador).trim();
            const val = lineaLimpia.substring(posSeparador + 1).trim();

            const tienePoet = /@@.*?@@/.test(val);
            const tieneIso = /==.*?==/.test(val);
            const tieneGlosa = /\+\+.*?\+\+/.test(val);
            const tieneNum = /\#\#[0-9\s]*?\#\#/.test(val);

            if (keyBase && tienePoet && tieneIso && tieneGlosa && tieneNum) {
              const claveFinal = obtenerClaveUnica(keyBase);
              localStorage.setItem(claveFinal, val);
            }
          }
        });

        reRender();
      };

      lector.readAsText(archivo, "UTF-8");
    }

    function exportarTXT() {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        keys.push(localStorage.key(i));
      }
      keys.sort((a, b) => a.localeCompare(b, 'el'));

      let contenido = "";
      keys.forEach(key => {
        const val = localStorage.getItem(key);
        contenido += `${key} : ${val}\n`;
      });

      const blob = new Blob([contenido], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "diccionario.txt";
      a.click();
      URL.revokeObjectURL(url);
    }

    function calcularCapacidadColumna() {
      const altoPantalla = window.innerHeight;
      const altoDisponible = altoPantalla - 110;
      const altoLinea = 18;
      const lineasTotales = Math.floor(altoDisponible / altoLinea);
      return Math.max(1, lineasTotales - 2);
    }

    function calcularNumColumnas() {
      const altoPantalla = window.innerHeight;
      const altoDisponible = altoPantalla - 110;
      const anchoColumnaIdeada = altoDisponible / RATIO_AUREO;
      const anchoPantalla = window.innerWidth - 30;
      const cols = Math.floor(anchoPantalla / anchoColumnaIdeada);
      return Math.max(1, cols);
    }

    function obtenerHTML() {
      let html = "";

      html += "<div class=\"top-bar\">";
      html += "<a href=\"javascript:iniciarNuevaEntrada()\">[+]</a>";
      html += "</div>";

      if (claveEditando !== null) {
        let valActual = esNuevaEntrada ? "" : (localStorage.getItem(claveEditando) || "");
        
        const tienePoet = /@@.*?@@/.test(valActual);
        const tieneIso = /==.*?==/.test(valActual);
        const tieneGlosa = /\+\+.*?\+\+/.test(valActual);
        const tieneNum = /\#\#[0-9\s]*?\#\#/.test(valActual);

        if (!tienePoet || !tieneIso || !tieneGlosa || !tieneNum) {
          valActual = PLANTILLA_DEFAULT;
        }

        html += "<div style=\"margin-bottom:10px;\">";
        if (mensajeError) {
          html += `<p class="error">${mensajeError}</p>`;
        }
        html += `<input type="text" id="input-key" value="${claveEditando}"><br>`;
        html += `<textarea id="input-val" rows="3" cols="80">${valActual}</textarea><br>`;
        html += "<a href=\"javascript:guardarEntrada()\">[Guardar]</a> ";
        html += "<a href=\"javascript:cancelarEdicion()\">[Cancelar]</a>";
        html += "</div>";
      }

      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        keys.push(localStorage.key(i));
      }
      keys.sort((a, b) => a.localeCompare(b, 'el'));

      const lineasPorColumna = calcularCapacidadColumna();
      const numCols = calcularNumColumnas();

      let itemsProcesados = [];
      keys.forEach(key => {
        const estaExpandido = (key === claveExpandida);
        let peso = 1;

        let renderFunc = (k) => {
          let itemHtml = "<div class=\"entry\">";
          itemHtml += `<a href="javascript:eliminarEntrada('${k}')">[X]</a> `;
          itemHtml += `<a href="javascript:iniciarEdicion('${k}')">[E]</a> `;
          itemHtml += `<a href="javascript:toggleExpandir('${k}')"><strong>${k}</strong></a>`;

          if (estaExpandido) {
            const rawVal = localStorage.getItem(k) || "";
            const parsed = parsearValue(rawVal);

            itemHtml += "<div class=\"seccion\">";
            itemHtml += `<p>${parsed.poetologico}</p>`;
            itemHtml += `<p>${parsed.isophonos}</p>`;
            itemHtml += `<p>${parsed.glosa}</p>`;
            itemHtml += `<p>${parsed.num}</p>`;
            itemHtml += "</div>";
          }
          itemHtml += "</div>";
          return itemHtml;
        };

        if (estaExpandido) {
          peso += 4;
        }

        itemsProcesados.push({
          key: key,
          peso: peso,
          html: renderFunc(key)
        });
      });

      let columnasPaginadas = [];
      let colActual = [];
      let pesoColActual = 0;

      itemsProcesados.forEach(item => {
        if (pesoColActual + item.peso > lineasPorColumna && colActual.length > 0) {
          columnasPaginadas.push(colActual);
          colActual = [];
          pesoColActual = 0;
        }
        colActual.push(item);
        pesoColActual += item.peso;
      });
      if (colActual.length > 0) {
        columnasPaginadas.push(colActual);
      }

      let paginas = [];
      for (let i = 0; i < columnasPaginadas.length; i += numCols) {
        paginas.push(columnasPaginadas.slice(i, i + numCols));
      }

      const altoPaginaCss = (window.innerHeight - 100) + "px";

      html += "<div class=\"pages-scroll-container\">";

      if (paginas.length === 0) {
        html += "<div class=\"page-sheet\" style=\"height:" + altoPaginaCss + ";\">";
        html += "<div class=\"page-header\">P1</div>";
        html += `<div class="dictionary-grid" style="grid-template-columns: repeat(${numCols}, 1fr);">`;
        for (let c = 0; c < numCols; c++) {
          html += "<div class=\"column\"></div>";
        }
        html += "</div>";
        html += "</div>";
      } else {
        paginas.forEach((colsPagina, pIdx) => {
          const numPag = pIdx + 1;
          html += "<div class=\"page-sheet\" style=\"height:" + altoPaginaCss + ";\">";
          html += `<div class="page-header">P${numPag}</div>`;
          html += `<div class="dictionary-grid" style="grid-template-columns: repeat(${numCols}, 1fr);">`;

          for (let cIdx = 0; cIdx < numCols; cIdx++) {
            const numCol = cIdx + 1;
            html += "<div class=\"column\">";
            
            if (colsPagina[cIdx]) {
              colsPagina[cIdx].forEach(item => {
                html += item.html;
              });
            }

            html += "</div>";
          }

          html += "</div>";
          html += "</div>";
        });
      }

      html += "</div>";

      html += "<div class=\"nav-bar\">";
      html += "<a href=\"javascript:abrirSelectorArchivo()\">[I]</a> ";
      html += "<a href=\"javascript:exportarTXT()\">[E TXT]</a>";
      html += "</div>";

      html += "<input type=\"file\" id=\"input-file-txt\" accept=\".txt\" style=\"display:none;\" onchange=\"importarDesdeArchivo(event)\">";

      return html;
    }

    window.addEventListener('resize', () => {
      reRender();
    });

    inicializarDatos();
    reRender();
  </script>

</body>
</html>
